spring.application.name=aluguel-carros
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# O Session pooler do plano gratuito do Supabase aceita poucas conexões simultâneas.
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiracao-minutos=480
app.cors.origens=${CORS_ORIGENS:http://localhost:5173}

# O Supabase cria a função rls_auto_enable no schema public antes da primeira migração.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
